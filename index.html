<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Protocol">
<meta name="theme-color" content="#0a0a0b">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%230a0a0b'/><text x='90' y='118' font-family='Arial Black,sans-serif' font-size='90' font-weight='900' fill='%23f59e0b' text-anchor='middle'>P</text></svg>">
<title>Protocol — 6 Week Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0b;
  --surface: #141417;
  --surface-2: #1c1c21;
  --surface-3: #25252c;
  --border: #2a2a32;
  --border-bright: #3a3a44;
  --text: #f5f0e8;
  --text-2: #9a9aa6;
  --text-3: #5e5e6b;
  --accent: #f59e0b;
  --accent-dim: #b45309;
  --accent-glow: rgba(245, 158, 11, 0.15);
  --success: #10b981;
  --danger: #ef4444;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  font-family: 'Manrope', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.45;
  padding-top: var(--safe-top);
  padding-bottom: calc(140px + var(--safe-bottom));
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(245, 158, 11, 0.08), transparent 60%);
  pointer-events: none; z-index: 0;
}
.app { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; }

/* HEADER */
header {
  padding: 18px 20px 12px;
  display: flex; align-items: flex-end; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(10,10,11,0.95), rgba(10,10,11,0.85));
  backdrop-filter: blur(12px);
  position: sticky; top: var(--safe-top); z-index: 10;
}
.brand-mark {
  font-family: 'Anton', sans-serif;
  font-size: 28px; letter-spacing: 0.08em;
  color: var(--text);
  line-height: 1;
}
.brand-mark span { color: var(--accent); }
.brand-sub {
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-3); margin-top: 6px;
  font-weight: 600;
}
.icon-btn {
  width: 38px; height: 38px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 10px;
  color: var(--text-2);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:active { background: var(--surface-2); }

/* WEEK BAR */
.week-bar {
  display: flex; gap: 6px;
  padding: 14px 20px; overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.week-bar::-webkit-scrollbar { display: none; }
.week-chip {
  flex-shrink: 0;
  min-width: 86px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 10px;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}
.week-chip-num {
  font-family: 'Anton', sans-serif;
  font-size: 16px; letter-spacing: 0.1em;
  color: var(--text-2);
  line-height: 1;
}
.week-chip-name {
  font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-3); margin-top: 4px;
  font-weight: 700;
}
.week-chip.active {
  border-color: var(--accent);
  background: var(--accent-glow);
}
.week-chip.active .week-chip-num { color: var(--accent); }
.week-chip.active .week-chip-name { color: var(--accent); }
.week-chip.deload {
  border-style: dashed;
}

/* DAY BAR */
.day-bar {
  display: flex; gap: 6px;
  padding: 12px 20px; overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
}
.day-bar::-webkit-scrollbar { display: none; }
.day-chip {
  flex-shrink: 0;
  padding: 8px 14px;
  border: 1px solid var(--border);
  background: transparent;
  border-radius: 999px;
  font-size: 12px; font-weight: 600;
  color: var(--text-2); cursor: pointer;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.day-chip.active {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}
.day-chip.logged-today::after {
  content: '●'; margin-left: 4px;
  color: var(--success); font-size: 8px;
}

/* MAIN */
main { padding: 16px 20px 20px; }

.day-header {
  margin-bottom: 18px;
}
.day-title {
  font-family: 'Anton', sans-serif;
  font-size: 36px; letter-spacing: 0.04em;
  line-height: 0.95;
  text-transform: uppercase;
}
.day-title em { color: var(--accent); font-style: normal; }
.day-meta {
  display: flex; gap: 16px; margin-top: 10px;
  font-size: 11px; color: var(--text-3); letter-spacing: 0.1em;
  text-transform: uppercase; font-weight: 600;
}
.day-meta-item span { color: var(--text-2); }

.week-banner {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  display: flex; align-items: flex-start; gap: 12px;
}
.week-banner-icon {
  font-family: 'Anton', sans-serif;
  font-size: 22px;
  color: var(--accent);
  line-height: 1;
}
.week-banner-text {
  font-size: 13px; color: var(--text-2);
  line-height: 1.5;
}
.week-banner-text strong { color: var(--text); }

/* EXERCISE CARDS */
.exercise {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 14px;
  overflow: hidden;
}
.exercise-head {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
}
.exercise-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.exercise-name {
  font-size: 15px; font-weight: 700;
  letter-spacing: -0.01em;
  flex: 1;
}
.exercise-target {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700;
  color: var(--accent); white-space: nowrap;
  background: var(--accent-glow);
  padding: 4px 8px; border-radius: 6px;
}
.exercise-notes {
  font-size: 12px; color: var(--text-3);
  margin-top: 6px; line-height: 1.4;
}
.tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tag {
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  padding: 3px 7px; border-radius: 4px;
  text-transform: uppercase;
}
.tag-extra { background: rgba(16, 185, 129, 0.1); color: var(--success); }
.tag-drop { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
.tag-rp { background: rgba(245, 158, 11, 0.12); color: var(--accent); }

.history-strip {
  padding: 8px 16px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  font-size: 11px; color: var(--text-3);
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.history-strip-label {
  font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  font-size: 9px; color: var(--text-3);
}
.history-strip-data {
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-2); font-weight: 500; font-size: 11px;
}
.history-strip-data b { color: var(--text); font-weight: 700; }

.suggest-strip {
  padding: 10px 16px;
  background: linear-gradient(90deg, var(--accent-glow), transparent);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  display: flex; align-items: center; gap: 8px;
}
.suggest-icon { color: var(--accent); font-size: 14px; }
.suggest-text { color: var(--text-2); }
.suggest-text b { color: var(--accent); font-family: 'JetBrains Mono', monospace; font-weight: 700; }

/* SET ROWS */
.sets { padding: 8px 8px 12px; }
.set-row {
  padding: 8px;
  border-bottom: 1px solid transparent;
}
.set-row.head {
  display: grid;
  grid-template-columns: 36px 1fr 1fr;
  gap: 8px;
  padding: 4px 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}
.set-row.head > div {
  font-size: 9px; letter-spacing: 0.14em;
  text-transform: uppercase; font-weight: 700;
  color: var(--text-3); text-align: center;
}
.set-main {
  display: grid;
  grid-template-columns: 36px 1fr 1fr;
  gap: 8px;
  align-items: center;
}
.set-num {
  font-family: 'Anton', sans-serif;
  font-size: 18px; color: var(--text-3);
  text-align: center; line-height: 1;
}
.set-row input {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700; font-size: 16px;
  padding: 12px 8px;
  border-radius: 8px;
  text-align: center;
  -webkit-appearance: none; appearance: none;
}
.set-row input:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface-3);
}
.rpe-picker {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-top: 8px;
  margin-left: 44px;
}
.rpe-btn {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-3);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700;
  padding: 9px 0;
  border-radius: 6px;
  cursor: pointer; min-width: 0;
}
.rpe-btn[data-rpe="7"], .rpe-btn[data-rpe="7.5"] { color: var(--success); }
.rpe-btn[data-rpe="8"], .rpe-btn[data-rpe="8.5"] { color: var(--accent); }
.rpe-btn[data-rpe="9"], .rpe-btn[data-rpe="9.5"], .rpe-btn[data-rpe="10"] { color: var(--danger); }
.rpe-btn.active {
  background: var(--text);
  color: var(--bg) !important;
  border-color: var(--text);
}

/* SAVE BAR - sticky above bottom nav */
.save-bar {
  position: fixed;
  bottom: calc(72px + var(--safe-bottom));
  left: 0; right: 0;
  padding: 12px 20px;
  display: flex; gap: 8px;
  background: var(--bg);
  border-top: 1px solid var(--border);
  z-index: 49;
  max-width: 720px;
  margin: 0 auto;
}
.btn {
  flex: 1; padding: 14px;
  background: var(--surface-3);
  border: 1px solid var(--border-bright);
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  font-weight: 700; font-size: 13px;
  letter-spacing: 0.06em; text-transform: uppercase;
  border-radius: 10px; cursor: pointer;
}
.btn:active { transform: scale(0.98); }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
}
.btn-ghost {
  background: transparent;
  border-color: var(--border);
  color: var(--text-2);
  flex: 0 0 auto; padding: 14px 16px;
}

/* SAVE TOAST */
.toast {
  position: fixed;
  bottom: calc(82px + var(--safe-bottom));
  left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--text);
  color: var(--bg);
  padding: 10px 18px; border-radius: 999px;
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.04em;
  opacity: 0; transition: all 0.3s;
  z-index: 100; pointer-events: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; justify-content: space-around;
  background: var(--bg);
  border-top: 1px solid var(--border);
  padding: 8px 0 calc(8px + var(--safe-bottom));
  z-index: 50;
}
.nav-btn {
  flex: 1; padding: 8px 4px;
  background: transparent; border: none;
  color: var(--text-3);
  font-family: 'Manrope', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.nav-btn-icon { font-size: 18px; line-height: 1; }
.nav-btn.active { color: var(--accent); }

/* PROGRESS VIEW */
.progress-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
}
.progress-card-name {
  font-weight: 700; font-size: 14px;
  margin-bottom: 10px;
}
.progress-sessions {
  display: flex; gap: 6px; overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.progress-sessions::-webkit-scrollbar { display: none; }
.progress-session {
  flex-shrink: 0;
  min-width: 92px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-2);
}
.progress-session-date {
  font-size: 9px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-3);
  font-weight: 700;
}
.progress-session-week {
  font-size: 9px; color: var(--accent);
  font-weight: 700; letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-top: 2px;
}
.progress-session-weight {
  font-family: 'Anton', sans-serif;
  font-size: 22px; color: var(--text);
  margin-top: 6px; line-height: 1;
}
.progress-session-weight span {
  font-size: 11px; color: var(--text-3);
  font-family: 'Manrope', sans-serif;
}
.progress-session-reps {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; color: var(--text-2);
  margin-top: 4px;
}

.empty-state {
  text-align: center; padding: 40px 20px;
  color: var(--text-3);
}
.empty-state-icon {
  font-family: 'Anton', sans-serif;
  font-size: 48px; color: var(--border-bright);
  margin-bottom: 12px;
}

/* EXPORT VIEW */
.export-text {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 14px;
  border-radius: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; line-height: 1.6;
  resize: vertical; min-height: 280px;
  -webkit-appearance: none;
}
.section-title {
  font-family: 'Anton', sans-serif;
  font-size: 18px; letter-spacing: 0.06em;
  margin-bottom: 12px;
}
.section-sub {
  font-size: 12px; color: var(--text-3);
  margin-bottom: 16px; line-height: 1.5;
}

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: none; align-items: flex-end;
  padding-bottom: var(--safe-bottom);
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface);
  border-top-left-radius: 20px;
  border-top-right-radius: 20px;
  border: 1px solid var(--border);
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 24px 20px 20px;
}
.modal h3 { font-family: 'Anton', sans-serif; font-size: 22px; letter-spacing: 0.04em; margin-bottom: 8px; }
.modal p { font-size: 13px; color: var(--text-2); line-height: 1.5; margin-bottom: 12px; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }

@media (min-width: 600px) {
  .day-title { font-size: 44px; }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <div class="brand-mark">PRO<span>TO</span>COL</div>
      <div class="brand-sub">6-Week Block · Hypertrophy</div>
    </div>
    <button class="icon-btn" id="settingsBtn">⋯</button>
  </header>

  <div class="week-bar" id="weekBar"></div>
  <div class="day-bar" id="dayBar"></div>

  <main id="mainContent"></main>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="workout">
    <span class="nav-btn-icon">▣</span>
    <span>Workout</span>
  </button>
  <button class="nav-btn" data-tab="progress">
    <span class="nav-btn-icon">▲</span>
    <span>Progress</span>
  </button>
  <button class="nav-btn" data-tab="export">
    <span class="nav-btn-icon">↗</span>
    <span>Export</span>
  </button>
</nav>

<div class="toast" id="toast">Saved</div>

<div class="modal-overlay" id="modal">
  <div class="modal" id="modalBody"></div>
</div>

<script>

/* ============================================================
   STATE & STORAGE
   ============================================================ */
const STORAGE_KEY = 'protocol_v1';
let state = {
  currentWeek: 1,
  currentDayId: DAYS[0].id,
  currentTab: 'workout',
  blockStartDate: null,
  sessions: [] // { id, week, dayId, date, exercises: [{ exerciseId, sets: [{weight, reps, rpe}] }] }
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = { ...state, ...parsed };
    }
  } catch(e) { console.warn('load failed', e); }
  if (!state.blockStartDate) state.blockStartDate = new Date().toISOString().slice(0,10);
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e) { console.warn('save failed', e); }
}

/* ============================================================
   PROGRAMME LOGIC
   ============================================================ */
function getWeek(n) { return WEEKS.find(w => w.n === n); }
function getDay(id) { return DAYS.find(d => d.id === id); }

function getModifiedSetCount(exerciseIndex, baseSets, week) {
  if (week.deload) return Math.max(2, Math.ceil(baseSets * 0.6));
  let sets = baseSets;
  if (exerciseIndex === 0 && week.extraSetFirst) sets += 1;
  if (exerciseIndex === 1 && week.extraSetSecond) sets += 1;
  return sets;
}

function getExerciseTags(exerciseIndex, week) {
  const tags = [];
  if (week.deload) tags.push({ cls: 'tag-rp', text: '−10% wt · −40% vol' });
  if (exerciseIndex === 0 && (week.extraSetFirst || week.extraSetSecond)) {
    if (week.extraSetFirst) tags.push({ cls: 'tag-extra', text: '+1 SET' });
  }
  if (exerciseIndex === 1 && week.extraSetSecond) tags.push({ cls: 'tag-extra', text: '+1 SET' });
  if (exerciseIndex === 0 && week.dropSetFirst) tags.push({ cls: 'tag-drop', text: 'DROP SET LAST' });
  if (exerciseIndex === 1 && week.restPauseSecond) tags.push({ cls: 'tag-rp', text: 'REST-PAUSE LAST' });
  if (week.dropSetIsolation && exerciseIndex >= 4) {
    if (exerciseIndex === 4) tags.push({ cls: 'tag-drop', text: 'DROP SET' });
  }
  return tags;
}

function getLastSessionForExercise(dayId, exerciseId, beforeWeek) {
  const candidates = state.sessions
    .filter(s => s.dayId === dayId && s.exercises.some(e => e.exerciseId === exerciseId))
    .filter(s => beforeWeek === undefined || s.week < beforeWeek)
    .sort((a, b) => new Date(b.date) - new Date(a.date));
  if (!candidates.length) return null;
  const sess = candidates[0];
  const ex = sess.exercises.find(e => e.exerciseId === exerciseId);
  return { session: sess, exercise: ex };
}

function getCurrentSessionForDay(dayId, week) {
  return state.sessions.find(s => s.dayId === dayId && s.week === week);
}

function suggestWeight(dayId, exercise, week) {
  // Look at most recent prior session
  const last = getLastSessionForExercise(dayId, exercise.id, week.n);
  if (!last || !last.exercise.sets.length) return null;

  const validSets = last.exercise.sets.filter(s => s.weight && s.reps);
  if (!validSets.length) return null;

  const topWeight = Math.max(...validSets.map(s => parseFloat(s.weight) || 0));
  if (!topWeight) return null;

  // Deload week
  if (week.deload) {
    return { weight: roundWeight(topWeight * 0.9), reason: 'Deload: ~10% lighter than peak' };
  }

  // Parse target rep range
  const repMatch = exercise.reps.match(/(\d+)\s*[–\-]\s*(\d+)/);
  if (!repMatch) return { weight: topWeight, reason: 'Repeat last weight' };
  const topRep = parseInt(repMatch[2]);
  const bottomRep = parseInt(repMatch[1]);

  // Get sets at top weight
  const setsAtTop = validSets.filter(s => parseFloat(s.weight) === topWeight);
  const reps = setsAtTop.map(s => parseInt(s.reps) || 0);
  const rpes = setsAtTop.map(s => parseFloat(s.rpe) || 0).filter(r => r > 0);
  const avgRPE = rpes.length ? rpes.reduce((a,b)=>a+b,0) / rpes.length : 0;
  const allHitTop = reps.every(r => r >= topRep);
  const anyMissBottom = reps.some(r => r < bottomRep);

  const isCompound = exercise.type === 'compound';
  const inc = isCompound ? 2.5 : 1.25;

  if (allHitTop && (avgRPE === 0 || avgRPE <= 8)) {
    return { weight: roundWeight(topWeight + inc), reason: `All sets hit ${topRep} reps — add ${inc}kg` };
  }
  if (allHitTop && avgRPE > 8) {
    return { weight: topWeight, reason: 'Hit reps but RPE high — repeat weight' };
  }
  if (anyMissBottom) {
    return { weight: roundWeight(topWeight - inc), reason: 'Missed bottom of range — drop weight' };
  }
  return { weight: topWeight, reason: 'Stay at last weight, push for more reps' };
}

function roundWeight(w) {
  return Math.round(w * 4) / 4; // round to nearest 0.25
}

/* ============================================================
   RENDERING
   ============================================================ */
function render() {
  renderWeekBar();
  renderDayBar();
  if (state.currentTab === 'workout') renderWorkout();
  else if (state.currentTab === 'progress') renderProgress();
  else if (state.currentTab === 'export') renderExport();
}

function renderWeekBar() {
  const bar = document.getElementById('weekBar');
  bar.innerHTML = WEEKS.map(w => `
    <button class="week-chip ${w.n === state.currentWeek ? 'active' : ''} ${w.deload ? 'deload' : ''}" data-week="${w.n}">
      <div class="week-chip-num">WK ${w.n}</div>
      <div class="week-chip-name">${w.name}</div>
    </button>
  `).join('');
  bar.querySelectorAll('.week-chip').forEach(el => {
    el.onclick = () => {
      state.currentWeek = parseInt(el.dataset.week);
      saveState(); render();
      // scroll active week into view
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    };
  });
}

function renderDayBar() {
  const bar = document.getElementById('dayBar');
  bar.innerHTML = DAYS.map(d => {
    const logged = !!getCurrentSessionForDay(d.id, state.currentWeek);
    return `
    <button class="day-chip ${d.id === state.currentDayId ? 'active' : ''} ${logged ? 'logged-today' : ''}" data-day="${d.id}">
      ${d.weekday} · ${d.name.toUpperCase()}
    </button>`;
  }).join('');
  bar.querySelectorAll('.day-chip').forEach(el => {
    el.onclick = () => { state.currentDayId = el.dataset.day; saveState(); render(); };
  });
}

function renderWorkout() {
  const day = getDay(state.currentDayId);
  const week = getWeek(state.currentWeek);
  const main = document.getElementById('mainContent');

  let html = `
    <div class="day-header">
      <div class="day-title">${day.name.split(' ').map((w, i) => i === day.name.split(' ').length - 1 ? `<em>${w}</em>` : w).join(' ')}</div>
      <div class="day-meta">
        <div class="day-meta-item">Week <span>${week.n} · ${week.name}</span></div>
        <div class="day-meta-item">RPE <span>${week.targetRPE}</span></div>
      </div>
    </div>
    <div class="week-banner">
      <div class="week-banner-icon">${week.code}</div>
      <div class="week-banner-text">${week.description}${week.finisher ? `<br><strong>Finisher:</strong> ${week.finisher}` : ''}</div>
    </div>
  `;

  // Get current session if exists, otherwise build a draft
  let currentSession = getCurrentSessionForDay(state.currentDayId, state.currentWeek);
  if (!currentSession) {
    currentSession = {
      id: `${state.currentWeek}-${state.currentDayId}-${Date.now()}`,
      week: state.currentWeek,
      dayId: state.currentDayId,
      date: new Date().toISOString(),
      exercises: day.exercises.map(ex => ({
        exerciseId: ex.id,
        sets: []
      }))
    };
  }

  day.exercises.forEach((ex, idx) => {
    const setCount = getModifiedSetCount(idx, ex.sets, week);
    const tags = getExerciseTags(idx, week);
    const last = getLastSessionForExercise(day.id, ex.id, week.n);
    const suggestion = suggestWeight(day.id, ex, week);

    // Find existing log entry for this exercise in current session
    let logEx = currentSession.exercises.find(e => e.exerciseId === ex.id);
    if (!logEx) {
      logEx = { exerciseId: ex.id, sets: [] };
      currentSession.exercises.push(logEx);
    }
    // Pad sets array
    while (logEx.sets.length < setCount) logEx.sets.push({ weight: '', reps: '', rpe: '' });

    html += `
      <div class="exercise" data-ex="${ex.id}">
        <div class="exercise-head">
          <div class="exercise-row">
            <div>
              <div class="exercise-name">${idx+1}. ${ex.name}</div>
              <div class="exercise-notes">${ex.notes}</div>
            </div>
            <div class="exercise-target">${setCount} × ${ex.reps}</div>
          </div>
          ${tags.length ? `<div class="tag-row">${tags.map(t => `<span class="tag ${t.cls}">${t.text}</span>`).join('')}</div>` : ''}
        </div>
        ${last ? `
          <div class="history-strip">
            <span class="history-strip-label">Last:</span>
            <span class="history-strip-data">
              ${last.exercise.sets.filter(s => s.weight).map(s => `<b>${s.weight}</b>×${s.reps}${s.rpe ? `@${s.rpe}` : ''}`).join('  ·  ') || '—'}
            </span>
          </div>` : ''}
        ${suggestion ? `
          <div class="suggest-strip">
            <span class="suggest-icon">→</span>
            <span class="suggest-text">Try <b>${suggestion.weight} kg</b> · ${suggestion.reason}</span>
          </div>` : ''}
        <div class="sets">
          <div class="set-row head">
            <div>Set</div><div>Weight</div><div>Reps</div>
          </div>
          ${Array.from({length: setCount}, (_, sIdx) => {
            const s = logEx.sets[sIdx] || { weight: '', reps: '', rpe: '' };
            return `
              <div class="set-row" data-set="${sIdx}">
                <div class="set-main">
                  <div class="set-num">${sIdx+1}</div>
                  <input type="number" inputmode="decimal" step="0.25" placeholder="${suggestion ? suggestion.weight : '—'}" value="${s.weight}" data-field="weight">
                  <input type="number" inputmode="numeric" step="1" placeholder="—" value="${s.reps}" data-field="reps">
                </div>
                <div class="rpe-picker">
                  ${RPE_VALUES.map(r => `<button class="rpe-btn ${parseFloat(s.rpe) === r ? 'active' : ''}" data-rpe="${r}">${r}</button>`).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  });

  html += `
    <div class="save-bar">
      <button class="btn btn-primary" id="saveSessionBtn">Save Session</button>
      <button class="btn btn-ghost" id="resetSessionBtn">Reset</button>
    </div>
  `;

  main.innerHTML = html;

  // Wire up inputs
  attachWorkoutHandlers(currentSession);
}

function attachWorkoutHandlers(session) {
  document.querySelectorAll('.exercise').forEach(card => {
    const exId = card.dataset.ex;
    const logEx = session.exercises.find(e => e.exerciseId === exId);

    card.querySelectorAll('.set-row[data-set]').forEach(row => {
      const sIdx = parseInt(row.dataset.set);
      while (logEx.sets.length <= sIdx) logEx.sets.push({ weight: '', reps: '', rpe: '' });
      const setObj = logEx.sets[sIdx];

      row.querySelectorAll('input').forEach(input => {
        input.oninput = () => {
          setObj[input.dataset.field] = input.value;
          autosave(session);
        };
      });
      row.querySelectorAll('.rpe-btn').forEach(btn => {
        btn.onclick = () => {
          const newRpe = parseFloat(btn.dataset.rpe);
          setObj.rpe = setObj.rpe == newRpe ? '' : newRpe;
          row.querySelectorAll('.rpe-btn').forEach(b => b.classList.remove('active'));
          if (setObj.rpe) btn.classList.add('active');
          autosave(session);
        };
      });
    });
  });

  document.getElementById('saveSessionBtn').onclick = () => {
    persistSession(session);
    showToast('Session saved');
  };
  document.getElementById('resetSessionBtn').onclick = () => {
    if (!confirm('Reset all sets for this session?')) return;
    state.sessions = state.sessions.filter(s => !(s.dayId === session.dayId && s.week === session.week));
    saveState(); render();
  };
}

let autosaveTimer = null;
function autosave(session) {
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => {
    persistSession(session, true);
  }, 600);
}

function persistSession(session, silent) {
  // Check if session has any data
  const hasData = session.exercises.some(ex =>
    ex.sets.some(s => s.weight || s.reps || s.rpe)
  );
  if (!hasData) return;

  // Update or insert
  session.date = new Date().toISOString();
  const idx = state.sessions.findIndex(s => s.dayId === session.dayId && s.week === session.week);
  if (idx >= 0) state.sessions[idx] = session;
  else state.sessions.push(session);
  saveState();

  // Update logged dot on day chip
  document.querySelectorAll('.day-chip').forEach(el => {
    const logged = !!getCurrentSessionForDay(el.dataset.day, state.currentWeek);
    el.classList.toggle('logged-today', logged);
  });
}

/* ============================================================
   PROGRESS VIEW
   ============================================================ */
function renderProgress() {
  const main = document.getElementById('mainContent');
  const day = getDay(state.currentDayId);

  let html = `
    <div class="day-header">
      <div class="day-title">PRO<em>GRESS</em></div>
      <div class="day-meta"><div class="day-meta-item">${day.name} · Last 6 sessions per lift</div></div>
    </div>
  `;

  let anyData = false;
  day.exercises.forEach(ex => {
    const sessions = state.sessions
      .filter(s => s.dayId === day.id && s.exercises.some(e => e.exerciseId === ex.id))
      .sort((a,b) => new Date(a.date) - new Date(b.date))
      .slice(-6);
    if (!sessions.length) return;
    anyData = true;

    html += `<div class="progress-card">
      <div class="progress-card-name">${ex.name}</div>
      <div class="progress-sessions">
        ${sessions.map(s => {
          const logEx = s.exercises.find(e => e.exerciseId === ex.id);
          const valid = logEx.sets.filter(set => set.weight);
          if (!valid.length) return '';
          const topW = Math.max(...valid.map(set => parseFloat(set.weight) || 0));
          const topSet = valid.find(set => parseFloat(set.weight) === topW);
          const totalReps = valid.reduce((a,b) => a + (parseInt(b.reps) || 0), 0);
          const wk = getWeek(s.week);
          return `<div class="progress-session">
            <div class="progress-session-date">${formatDate(s.date)}</div>
            <div class="progress-session-week">WK ${s.week}${wk && wk.deload ? ' · Deload' : ''}</div>
            <div class="progress-session-weight">${topW}<span> kg</span></div>
            <div class="progress-session-reps">${valid.length}×${topSet ? topSet.reps : '—'} · ${totalReps} total</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });

  if (!anyData) {
    html += `<div class="empty-state">
      <div class="empty-state-icon">∅</div>
      <p>No data yet for ${day.name}.<br>Log a session to start tracking progression.</p>
    </div>`;
  }

  main.innerHTML = html;
}

   ============================================================ */
function renderExport() {
  const main = document.getElementById('mainContent');
  const text = buildExportText();
  main.innerHTML = `
    <div class="day-header">
      <div class="day-title">EX<em>PORT</em></div>
      <div class="day-meta"><div class="day-meta-item">Share with Claude · ${state.sessions.length} sessions</div></div>
    </div>
    <div class="section-sub">
      Tap "Copy" then paste into your Claude conversation. Claude can analyse trends, adjust your programme, and recommend next-session weights.
    </div>
    <textarea class="export-text" id="exportText" readonly>${text}</textarea>
    <div class="save-bar" style="margin-top: 12px;">
      <button class="btn btn-primary" id="copyExportBtn">Copy to Clipboard</button>
      <button class="btn btn-ghost" id="clearAllBtn">Clear All</button>
    </div>
  `;
  document.getElementById('copyExportBtn').onclick = async () => {
    const ta = document.getElementById('exportText');
    try {
      await navigator.clipboard.writeText(ta.value);
      showToast('Copied');
    } catch(e) {
      ta.select(); document.execCommand('copy');
      showToast('Copied');
    }
  };
  document.getElementById('clearAllBtn').onclick = () => {
    if (!confirm('Delete all logged sessions? This cannot be undone.')) return;
    if (!confirm('Are you sure? All your training data will be permanently deleted.')) return;
    state.sessions = [];
    saveState(); render();
  };
}

function buildExportText() {
  if (!state.sessions.length) return 'No sessions logged yet.';
  const sorted = [...state.sessions].sort((a,b) => {
    if (a.week !== b.week) return a.week - b.week;
    return DAYS.findIndex(d => d.id === a.dayId) - DAYS.findIndex(d => d.id === b.dayId);
  });
  let out = `PROTOCOL — Training Log\n`;
  out += `Block start: ${state.blockStartDate}\n`;
  out += `Total sessions: ${state.sessions.length}\n\n`;

  sorted.forEach(s => {
    const day = getDay(s.dayId);
    const wk = getWeek(s.week);
    out += `=== Week ${s.week} (${wk.name}) · ${day.name} · ${formatDate(s.date)} ===\n`;
    s.exercises.forEach(logEx => {
      const ex = day.exercises.find(e => e.id === logEx.exerciseId);
      if (!ex) return;
      const valid = logEx.sets.filter(set => set.weight || set.reps);
      if (!valid.length) return;
      out += `  ${ex.name} (target ${ex.sets}×${ex.reps})\n`;
      valid.forEach((set, i) => {
        out += `    Set ${i+1}: ${set.weight || '—'}kg × ${set.reps || '—'} reps`;
        if (set.rpe) out += ` @ RPE ${set.rpe}`;
        out += `\n`;
      });
    });
    out += `\n`;
  });
  return out;
}

/* ============================================================
   UTILITIES
   ============================================================ */
function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 1600);
}

function showSettings() {
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <h3>SETTINGS</h3>
    <p><strong>Block started:</strong> ${state.blockStartDate}</p>
    <p><strong>Sessions logged:</strong> ${state.sessions.length}</p>
    <p>Data is stored locally on your device only. To back up, use Export and save the text somewhere safe.</p>
    <p style="font-size: 11px; color: var(--text-3); margin-top: 16px;">PROTOCOL v1 · 6-Week Hypertrophy Block · Built for Sergio</p>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="document.getElementById('modal').classList.remove('show')">Close</button>
    </div>
  `;
  document.getElementById('modal').classList.add('show');
}

/* ============================================================
   INIT
   ============================================================ */
loadState();
render();

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.currentTab = btn.dataset.tab;
    render();
    window.scrollTo(0, 0);
  };
});

document.getElementById('settingsBtn').onclick = showSettings;
document.getElementById('modal').onclick = (e) => {
  if (e.target.id === 'modal') document.getElementById('modal').classList.remove('show');
};

// Scroll active week into view on load
setTimeout(() => {
  const active = document.querySelector('.week-chip.active');
  if (active) active.scrollIntoView({ behavior: 'auto', block: 'nearest', inline: 'center' });
}, 100);
</script>
</body>
</html>
